<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a92a6"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f8cff"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1115"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <text x="32" y="40" fill="#e6e8ee" font-size="22" font-weight="700">Voice Agent — fully local, open-weight, answers in your own voice</text>
  <text x="32" y="62" fill="#8a92a6" font-size="13">Intel Core Ultra 7 155H · English STT on the NPU · LLM + voice-clone decoder on the Arc iGPU · VAD, vocoder, voice lock on the CPU · no cloud, no API keys</text>

  <!-- lanes -->
  <rect x="32" y="84" width="1376" height="128" rx="12" fill="#151a24" stroke="#262b36"/>
  <text x="46" y="104" fill="#8a92a6" font-size="11" letter-spacing="1.5">CPU · MAIN PROCESS</text>
  <rect x="32" y="226" width="1376" height="92" rx="12" fill="#141c2a" stroke="#2b3a55"/>
  <text x="46" y="246" fill="#8a92a6" font-size="11" letter-spacing="1.5">NPU · INTEL AI BOOST</text>
  <rect x="32" y="332" width="1376" height="150" rx="12" fill="#1a1626" stroke="#3d2f5c"/>
  <text x="46" y="352" fill="#8a92a6" font-size="11" letter-spacing="1.5">GPU · INTEL ARC iGPU</text>
  <rect x="32" y="496" width="1376" height="92" rx="12" fill="#151a24" stroke="#262b36"/>
  <text x="46" y="516" fill="#8a92a6" font-size="11" letter-spacing="1.5">CPU · TTS WORKER PROCESS (own environment)</text>

  <!-- CPU lane boxes: 6 boxes, 205 wide, gap 20, starting x=52 -->
  <g font-size="11" fill="#8a92a6" text-anchor="middle">
    <rect x="52" y="116" width="205" height="82" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="154" y="138" fill="#fff" font-size="13" font-weight="600">Microphone</text>
    <text x="154" y="156">16 kHz · 32 ms frames · mute gate</text>
    <text x="154" y="172">or browser mic over WebSocket</text>

    <rect x="277" y="116" width="205" height="82" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="379" y="138" fill="#fff" font-size="13" font-weight="600">Silero VAD v6 + endpointer</text>
    <text x="379" y="156">noise-floor energy gate</text>
    <text x="379" y="172">tentative end 64 ms → firm end 280 ms</text>
    <text x="379" y="188">"…and" waits 700 ms</text>

    <rect x="502" y="116" width="205" height="82" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="604" y="138" fill="#fff" font-size="13" font-weight="600">Voice lock</text>
    <text x="604" y="156">WeSpeaker CAM++ embedding</text>
    <text x="604" y="172">cosine vs your enrolled voice</text>
    <text x="604" y="188">any language · ~45 ms</text>

    <rect x="727" y="116" width="205" height="82" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="829" y="138" fill="#fff" font-size="13" font-weight="600">Turn orchestrator</text>
    <text x="829" y="156">speculative start · cancel / merge</text>
    <text x="829" y="172">playback gated on the firm end</text>
    <text x="829" y="188">per-turn latency metrics</text>

    <rect x="952" y="116" width="205" height="82" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="1054" y="138" fill="#fff" font-size="13" font-weight="600">Clause chunker</text>
    <text x="1054" y="156">first chunk after 3 words</text>
    <text x="1054" y="172">then clauses / sentences</text>
    <text x="1054" y="188">Devanagari → Hindi voice</text>

    <rect x="1177" y="116" width="215" height="82" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="1284" y="138" fill="#fff" font-size="13" font-weight="600">Speaker · tools · console</text>
    <text x="1284" y="156">48 kHz gapless queue · echo guard</text>
    <text x="1284" y="172">weather · Wikipedia · search (prefetch)</text>
    <text x="1284" y="188">FastAPI console · /record window</text>
  </g>

  <!-- NPU lane -->
  <g text-anchor="middle">
    <rect x="277" y="258" width="430" height="46" rx="8" fill="#1d2a40" stroke="#3b5a8f"/>
    <text x="492" y="277" fill="#fff" font-size="13" font-weight="600">Granite Speech 5.0 · 470M TurboCTC (English, Apache-2.0)</text>
    <text x="492" y="294" fill="#aeb4c2" font-size="11">OpenVINO static buckets 6 s / 15 s · one non-autoregressive pass · 115–150 ms</text>
  </g>

  <!-- GPU lane -->
  <g text-anchor="middle">
    <rect x="277" y="364" width="430" height="64" rx="8" fill="#2a1f3d" stroke="#6b4fa8"/>
    <text x="492" y="386" fill="#fff" font-size="13" font-weight="600">Whisper large-v3-turbo int4 (99 languages, MIT)</text>
    <text x="492" y="404" fill="#aeb4c2" font-size="11">OpenVINO GenAI · used when the fast transcript isn't English,</text>
    <text x="492" y="419" fill="#aeb4c2" font-size="11">verified in parallel when borderline · ~0.9 s</text>

    <rect x="727" y="364" width="300" height="106" rx="8" fill="#2a1f3d" stroke="#6b4fa8"/>
    <text x="877" y="386" fill="#fff" font-size="13" font-weight="600">Granite 4.2 3B · Ollama (Vulkan)</text>
    <text x="877" y="404" fill="#aeb4c2" font-size="11">private instance, 1 slot → KV-cache reuse</text>
    <text x="877" y="419" fill="#aeb4c2" font-size="11">streaming · native tool loop · think off</text>
    <text x="877" y="434" fill="#aeb4c2" font-size="11">abort by closing the socket</text>
    <text x="877" y="449" fill="#aeb4c2" font-size="11">first token 100–250 ms · 12–18 tok/s</text>
    <text x="877" y="464" fill="#aeb4c2" font-size="11">answers in the language you spoke</text>

    <rect x="1047" y="364" width="345" height="64" rx="8" fill="#2a1f3d" stroke="#6b4fa8"/>
    <text x="1219" y="386" fill="#fff" font-size="13" font-weight="600">LuxTTS flow-matching decoder (cloned voice)</text>
    <text x="1219" y="404" fill="#aeb4c2" font-size="11">OpenVINO static buckets, f32, filled with real text</text>
    <text x="1219" y="419" fill="#aeb4c2" font-size="11">2 steps for the first chunk, 4 after · ~70 ms per step</text>
  </g>

  <!-- worker lane -->
  <g text-anchor="middle">
    <rect x="727" y="528" width="300" height="46" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="877" y="547" fill="#fff" font-size="13" font-weight="600">Kokoro-82M · Hindi voice (Apache-2.0)</text>
    <text x="877" y="564" fill="#8a92a6" font-size="11">in-process fallback for Devanagari replies</text>

    <rect x="1047" y="528" width="345" height="46" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="1219" y="547" fill="#fff" font-size="13" font-weight="600">LuxTTS worker · text encoder · vocoder · voice cache</text>
    <text x="1219" y="564" fill="#8a92a6" font-size="11">stdio protocol (JSON + PCM) · pre-synthesized fillers "Hmm." "Let me check."</text>
  </g>

  <!-- arrows -->
  <g stroke="#8a92a6" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M257 157 H277"/>
    <path d="M482 157 H502"/>
    <path d="M707 157 H727"/>
    <path d="M932 157 H952"/>
    <path d="M1157 157 H1177"/>
    <path d="M379 198 V258"/>
    <path d="M604 198 V364"/>
    <path d="M707 281 C 760 281, 780 364, 800 364"/>
    <path d="M707 396 H727"/>
    <path d="M1027 417 H1047"/>
    <path d="M877 470 V528"/>
    <path d="M1219 428 V528"/>
    <path d="M1392 551 C 1425 551, 1425 200, 1392 198"/>
  </g>
  <g stroke="#4f8cff" stroke-width="1.6" fill="none" marker-end="url(#ab)" stroke-dasharray="5 3">
    <path d="M829 198 V364"/>
  </g>
  <text x="838" y="300" fill="#4f8cff" font-size="11">LLM request + weather prefetch</text>
  <text x="392" y="232" fill="#8a92a6" font-size="11">utterance audio</text>
  <text x="1232" y="496" fill="#8a92a6" font-size="11">mel features → 48 kHz audio</text>
  <text x="1398" y="380" fill="#8a92a6" font-size="11" transform="rotate(90 1398 380)">audio → speaker / browser</text>

  <!-- timeline -->
  <rect x="32" y="604" width="1376" height="228" rx="12" fill="#151a24" stroke="#262b36"/>
  <text x="46" y="626" fill="#8a92a6" font-size="11" letter-spacing="1.5">ONE TURN · MILLISECONDS AFTER YOU STOP TALKING (measured, English, steady state)</text>
  <line x1="90" y1="712" x2="1350" y2="712" stroke="#3a4152" stroke-width="2"/>
  <g fill="#e6e8ee" font-size="12" text-anchor="middle">
    <g><circle cx="90" cy="712" r="6" fill="#8a92a6"/><text x="90" y="740">−320 tentative end</text><text x="90" y="756" fill="#8a92a6" font-size="11">STT + LLM start speculatively</text></g>
    <g><circle cx="300" cy="712" r="6" fill="#3ecf8e"/><text x="300" y="690">−130 transcript ready</text></g>
    <g><circle cx="470" cy="712" r="6" fill="#f5b342"/><text x="470" y="740">0 firm end of turn</text></g>
    <g><circle cx="560" cy="712" r="6" fill="#c58bff"/><text x="560" y="690">170 "Hmm." in your cloned voice</text></g>
    <g><circle cx="620" cy="712" r="6" fill="#4f8cff"/><text x="620" y="740">330 LLM first token</text></g>
    <g><circle cx="820" cy="712" r="6" fill="#4f8cff"/><text x="820" y="690">520 first chunk text (3 words)</text></g>
    <g><circle cx="1040" cy="712" r="8" fill="#3ecf8e"/><text x="1040" y="740" font-weight="700" font-size="13">950–1200 first answer audio</text></g>
    <g><circle cx="1330" cy="712" r="6" fill="#8a92a6"/><text x="1330" y="690">later chunks overlap playback</text></g>
  </g>
  <text x="46" y="806" fill="#8a92a6" font-size="11">Models: Silero VAD · Granite Speech 5.0 · Whisper large-v3-turbo · Granite 4.2 3B · LuxTTS / LinaCodec · Kokoro-82M · WeSpeaker CAM++ — all open weights (Apache-2.0 / MIT)</text>
  <text x="46" y="822" fill="#5c6478" font-size="11">github.com/priyansh19/voice-agent</text>
</svg>
