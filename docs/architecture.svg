<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a92a6"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f8cff"/></marker>
  </defs>
  <rect width="1180" height="760" fill="#0f1115"/>
  <text x="24" y="34" fill="#e6e8ee" font-size="20" font-weight="700">Voice Agent — architecture (all open-weight, all local)</text>
  <text x="24" y="54" fill="#8a92a6">Intel Core Ultra 7 155H · STT on NPU · LLM + TTS flow on Arc iGPU · VAD, vocoder, voice lock on CPU</text>

  <!-- hardware lanes -->
  <rect x="24" y="80" width="1132" height="120" rx="10" fill="#151a24" stroke="#262b36"/>
  <text x="36" y="100" fill="#8a92a6" font-size="11" letter-spacing="1">CPU</text>
  <rect x="24" y="215" width="1132" height="110" rx="10" fill="#141c2a" stroke="#262b36"/>
  <text x="36" y="235" fill="#8a92a6" font-size="11" letter-spacing="1">NPU (Intel AI Boost)</text>
  <rect x="24" y="340" width="1132" height="150" rx="10" fill="#1a1626" stroke="#262b36"/>
  <text x="36" y="360" fill="#8a92a6" font-size="11" letter-spacing="1">GPU (Intel Arc iGPU)</text>
  <rect x="24" y="505" width="1132" height="105" rx="10" fill="#151a24" stroke="#262b36"/>
  <text x="36" y="525" fill="#8a92a6" font-size="11" letter-spacing="1">CPU · separate TTS worker process (own venv)</text>

  <!-- CPU lane boxes -->
  <g>
    <rect x="40" y="112" width="120" height="70" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="100" y="140" fill="#fff" text-anchor="middle" font-weight="600">Microphone</text>
    <text x="100" y="158" fill="#8a92a6" text-anchor="middle" font-size="11">16 kHz · 32 ms frames</text>
    <text x="100" y="172" fill="#8a92a6" text-anchor="middle" font-size="11">mute gate (UI)</text>

    <rect x="190" y="112" width="160" height="70" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="270" y="134" fill="#fff" text-anchor="middle" font-weight="600">Silero VAD v6 + endpointer</text>
    <text x="270" y="151" fill="#8a92a6" text-anchor="middle" font-size="11">noise-floor energy gate</text>
    <text x="270" y="165" fill="#8a92a6" text-anchor="middle" font-size="11">tentative end (64 ms) → firm end (320 ms)</text>
    <text x="270" y="178" fill="#8a92a6" text-anchor="middle" font-size="11">adaptive: "…and" waits 700 ms</text>

    <rect x="380" y="112" width="150" height="70" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="455" y="134" fill="#fff" text-anchor="middle" font-weight="600">Voice lock</text>
    <text x="455" y="151" fill="#8a92a6" text-anchor="middle" font-size="11">WeSpeaker CAM++ embedding</text>
    <text x="455" y="165" fill="#8a92a6" text-anchor="middle" font-size="11">cosine vs enrolled voice</text>
    <text x="455" y="178" fill="#8a92a6" text-anchor="middle" font-size="11">any language · ~45 ms</text>

    <rect x="560" y="112" width="170" height="70" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="645" y="134" fill="#fff" text-anchor="middle" font-weight="600">Turn orchestrator</text>
    <text x="645" y="151" fill="#8a92a6" text-anchor="middle" font-size="11">speculative start · cancel/merge</text>
    <text x="645" y="165" fill="#8a92a6" text-anchor="middle" font-size="11">playback gated on firm end</text>
    <text x="645" y="178" fill="#8a92a6" text-anchor="middle" font-size="11">per-turn latency metrics</text>

    <rect x="760" y="112" width="150" height="70" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="835" y="134" fill="#fff" text-anchor="middle" font-weight="600">Clause chunker</text>
    <text x="835" y="151" fill="#8a92a6" text-anchor="middle" font-size="11">first chunk ≤ 5 words</text>
    <text x="835" y="165" fill="#8a92a6" text-anchor="middle" font-size="11">then clauses / sentences</text>
    <text x="835" y="178" fill="#8a92a6" text-anchor="middle" font-size="11">Devanagari → Hindi route</text>

    <rect x="940" y="112" width="200" height="70" rx="8" fill="#22262f" stroke="#3a4152"/>
    <text x="1040" y="134" fill="#fff" text-anchor="middle" font-weight="600">Speaker + tools + UI</text>
    <text x="1040" y="151" fill="#8a92a6" text-anchor="middle" font-size="11">48 kHz gapless queue · echo guard</text>
    <text x="1040" y="165" fill="#8a92a6" text-anchor="middle" font-size="11">Open-Meteo · Wikipedia · DDG (prefetch)</text>
    <text x="1040" y="178" fill="#8a92a6" text-anchor="middle" font-size="11">FastAPI console · /record window</text>
  </g>

  <!-- NPU lane -->
  <rect x="190" y="248" width="340" height="62" rx="8" fill="#1d2a40" stroke="#3b5a8f"/>
  <text x="360" y="272" fill="#fff" text-anchor="middle" font-weight="600">Granite Speech 5.0 470M TurboCTC (English, Apache-2.0)</text>
  <text x="360" y="290" fill="#aeb4c2" text-anchor="middle" font-size="11">OpenVINO static buckets 6 s / 15 s · one non-autoregressive pass · 115–150 ms</text>

  <!-- GPU lane -->
  <rect x="190" y="372" width="340" height="62" rx="8" fill="#2a1f3d" stroke="#6b4fa8"/>
  <text x="360" y="396" fill="#fff" text-anchor="middle" font-weight="600">Whisper large-v3-turbo int4 (99 languages, MIT)</text>
  <text x="360" y="414" fill="#aeb4c2" text-anchor="middle" font-size="11">OpenVINO GenAI · runs in parallel · overrides the CTC transcript when they disagree · ~0.9 s</text>

  <rect x="560" y="372" width="230" height="100" rx="8" fill="#2a1f3d" stroke="#6b4fa8"/>
  <text x="675" y="396" fill="#fff" text-anchor="middle" font-weight="600">Granite 4.2 3B · private Ollama, 1 slot (Vulkan)</text>
  <text x="675" y="414" fill="#aeb4c2" text-anchor="middle" font-size="11">streaming, native tool loop, think=false</text>
  <text x="675" y="430" fill="#aeb4c2" text-anchor="middle" font-size="11">KV-cache reuse · abort by closing socket</text>
  <text x="675" y="446" fill="#aeb4c2" text-anchor="middle" font-size="11">first token 100–250 ms · 12–18 tok/s</text>
  <text x="675" y="462" fill="#aeb4c2" text-anchor="middle" font-size="11">replies in the user's language (hi / Hinglish / en)</text>

  <rect x="820" y="372" width="320" height="62" rx="8" fill="#2a1f3d" stroke="#6b4fa8"/>
  <text x="980" y="396" fill="#fff" text-anchor="middle" font-weight="600">LuxTTS flow-matching decoder (cloned voice)</text>
  <text x="980" y="414" fill="#aeb4c2" text-anchor="middle" font-size="11">OpenVINO static buckets (f32) filled with real text · 2 steps first chunk, 4 after · 70 ms/step</text>

  <!-- worker lane -->
  <rect x="560" y="538" width="230" height="60" rx="8" fill="#22262f" stroke="#3a4152"/>
  <text x="675" y="560" fill="#fff" text-anchor="middle" font-weight="600">Kokoro-82M (Hindi voice, Apache-2.0)</text>
  <text x="675" y="578" fill="#8a92a6" text-anchor="middle" font-size="11">in-process fallback for Devanagari replies</text>

  <rect x="820" y="538" width="320" height="60" rx="8" fill="#22262f" stroke="#3a4152"/>
  <text x="980" y="560" fill="#fff" text-anchor="middle" font-weight="600">LuxTTS worker: text encoder (ORT) · vocoder (torch) · voice prompt cache</text>
  <text x="980" y="578" fill="#8a92a6" text-anchor="middle" font-size="11">stdio protocol: JSON header + float32 PCM · pre-synthesized fillers "Hmm." "Let me check."</text>

  <!-- arrows -->
  <g stroke="#8a92a6" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M160 147 H190"/>
    <path d="M350 147 H380"/>
    <path d="M530 147 H560"/>
    <path d="M730 147 H760"/>
    <path d="M910 147 H940"/>
    <path d="M300 182 V248"/>
    <path d="M420 182 V372"/>
    <path d="M420 310 V372" stroke-dasharray="4 3"/>
    <path d="M530 279 C 600 279, 620 372, 640 372"/>
    <path d="M530 403 L560 403"/>
    <path d="M790 420 L820 420"/>
    <path d="M675 472 V538"/>
    <path d="M980 434 V538"/>
    <path d="M1140 568 C 1170 568, 1170 200, 1100 182"/>
  </g>
  <g stroke="#4f8cff" stroke-width="1.6" fill="none" marker-end="url(#ab)" stroke-dasharray="5 3">
    <path d="M645 182 V372"/>
  </g>
  <text x="655" y="300" fill="#4f8cff" font-size="11">LLM request + weather prefetch</text>
  <text x="305" y="220" fill="#8a92a6" font-size="11">utterance audio</text>
  <text x="1000" y="470" fill="#8a92a6" font-size="11">mel features → 48 kHz audio</text>
  <text x="1145" y="380" fill="#8a92a6" font-size="11" transform="rotate(90 1145 380)">audio out → speaker</text>

  <!-- timeline -->
  <rect x="24" y="625" width="1132" height="115" rx="10" fill="#151a24" stroke="#262b36"/>
  <text x="36" y="646" fill="#8a92a6" font-size="11" letter-spacing="1">ONE TURN, ms AFTER YOU STOP TALKING (measured)</text>
  <line x1="60" y1="700" x2="1120" y2="700" stroke="#3a4152" stroke-width="2"/>
  <g fill="#e6e8ee" font-size="11" text-anchor="middle">
    <g><circle cx="60" cy="700" r="5" fill="#8a92a6"/><text x="60" y="720">−320 tentative end</text><text x="60" y="734" fill="#8a92a6">STT + LLM start</text></g>
    <g><circle cx="230" cy="700" r="5" fill="#3ecf8e"/><text x="230" y="686">−130 STT done</text></g>
    <g><circle cx="380" cy="700" r="5" fill="#f5b342"/><text x="380" y="720">0 firm end</text></g>
    <g><circle cx="470" cy="700" r="5" fill="#c58bff"/><text x="470" y="686">167 filler audible</text><text x="470" y="734" fill="#8a92a6">"Hmm." in your voice</text></g>
    <g><circle cx="510" cy="700" r="5" fill="#4f8cff"/><text x="510" y="720">236 LLM first token</text></g>
    <g><circle cx="690" cy="700" r="5" fill="#4f8cff"/><text x="690" y="686">580 first chunk text</text></g>
    <g><circle cx="880" cy="700" r="6" fill="#3ecf8e"/><text x="880" y="720" font-weight="700">967 first answer audio</text></g>
    <g><circle cx="1100" cy="700" r="5" fill="#8a92a6"/><text x="1100" y="686">later chunks overlap playback</text></g>
  </g>
</svg>
