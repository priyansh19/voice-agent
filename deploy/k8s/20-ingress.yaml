# Routing.  Traefik ranks plain Ingress rules by rule-string length, so PathPrefix("/") would beat Path("/ws");
# the agent paths therefore live in IngressRoutes with explicit priorities, and the Ingress only carries "/".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: site, port: {number: 80}}}
---
# Console UI at /agent/ (prefix stripped so the agent serves its index) — the native agent on the host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agent-console
  namespace: web
spec:
  entryPoints: [web, websecure]
  routes:
    - match: PathPrefix(`/agent`)
      kind: Rule
      priority: 50
      middlewares: [{name: strip-agent}]
      services: [{name: voice-agent, port: 8765}]
---
# WebSockets and assets used by the console (paths as the agent serves them).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agent-paths
  namespace: web
spec:
  entryPoints: [web, websecure]
  routes:
    - match: PathPrefix(`/ws`) || PathPrefix(`/audio`) || PathPrefix(`/record`) || PathPrefix(`/voice.wav`)
      kind: Rule
      priority: 60
      services: [{name: voice-agent, port: 8765}]
