[project]
name = "voice-agent"
version = "0.1.0"
description = "Sub-second local voice agent built only on open-weight models (Granite STT + Granite LLM via Ollama + LuxTTS voice clone / Kokoro)"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.30.0",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "onnxruntime>=1.29.0",
    "openvino>=2026.3.1",
    "openvino-genai>=2026.3.1.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "transformers>=5.16",
    "uvicorn[standard]>=0.52.4",
    "wordfreq>=3.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
apple = [
    "mlx-whisper>=0.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
timeout = 120
addopts = "-q"
markers = ["speed: latency-budget tests of the orchestration with fake models"]

[tool.ruff]
line-length = 130
target-version = "py312"
exclude = ["benchmarks", ".venv", "tts_worker/.venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E401", "E402", "E501", "E701", "E702", "E731", "B006", "B008", "B023", "W291", "W293", "I001"]
