name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run python -m compileall -q agent ui tts_worker tools tests main.py

  unit:
    name: Unit + orchestration tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: System audio libs (PortAudio for sounddevice)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2 libsndfile1
      - run: uv sync --group dev
      - name: Run tests (models are replaced by fakes; no GPU/NPU/mic needed)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run pytest tests/unit -q -p no:cacheprovider --junitxml=junit-${{ matrix.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: junit-*.xml

  speed-budget:
    name: Orchestration latency budget
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2 libsndfile1
      - run: uv sync --group dev
      - name: Pipeline overhead with fake models of known latency must stay < 250 ms
        env:
          PYTHONIOENCODING: utf-8
        run: uv run pytest tests/unit -q -p no:cacheprovider -m speed -rA

  web:
    name: Hosted console is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_web.py
      - name: web/ must match ui/index.html (run tools/build_web.py and commit)
        run: git diff --exit-code -- web/
